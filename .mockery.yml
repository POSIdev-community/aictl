      all: true
  github.com/POSIdev-community/aictl/internal/core/usecase/scan/checkpolicies:
    config:
      all: true
  github.com/POSIdev-community/aictl/internal/core/usecase/get/scan/state:
    config:
      all: true
  github.com/POSIdev-community/aictl/internal/core/usecase/get/project/exclusions:
    config:
      all: true
  github.com/POSIdev-community/aictl/internal/core/usecase/get/queue:
    config:
      all: true
  github.com/POSIdev-community/aictl/internal/core/usecase/get/reporttemplates:
