version: '3'

silent: true

vars:
  LOCAL_BIN: '{{.ROOT_DIR}}/bin'
  VERSION:
    sh: cat VERSION
  LDFLAGS: "-X 'github.com/POSIdev-community/aictl/pkg/version.version={{.VERSION}}' -s -w"

env:
  GOBIN: '{{.LOCAL_BIN}}'
  PATH: '{{.LOCAL_BIN}}:{{env "PATH"}}'

tasks:
  default:
    desc: Generate, test, build, and regenerate docs
    cmds:
      - task: generate
      - task: test
      - task: build
      - task: doc

  quick:
    desc: Generate and build
    cmds:
      - task: generate
      - task: build

  pre-commit:
    desc: Generate, test, and regenerate docs
    cmds:
      - task: generate
      - task: test
      - task: doc

  ensure-bin:
    internal: true
    cmds:
      - mkdir -p {{.LOCAL_BIN}}

  install-mockery:
    internal: true
    cmds:
      - task: ensure-bin
      - echo -n "⇒ Installing mockery... "
      - go install github.com/vektra/mockery/v3@v3.5.1 >/dev/null 2>&1
      - echo "$(mockery version) ✅"

  install-enumer:
    internal: true
    cmds:
      - task: ensure-bin
      - echo -n "⇒ Installing enumer... "
      - go install github.com/dmarkham/enumer@latest >/dev/null 2>&1
      - echo "✅"

  install-golangci-lint:
    internal: true
    cmds:
      - task: ensure-bin
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          echo "⇒ golangci-lint already on PATH ✅"
          exit 0
        fi
        echo -n "⇒ Installing golangci-lint... "
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
        echo "✅"

  install-tools:
    desc: Install mockery and enumer
    cmds:
      - task: install-mockery
      - task: install-enumer

  lint:
    desc: Run golangci-lint
    cmds:
      - task: install-golangci-lint
      - echo -n "⇒ Linting... "
      - golangci-lint run
      - echo "✅"

  generate-mocks:
    desc: Generate mocks with mockery
    cmds:
      - task: install-mockery
      - echo -n "⇒ Generating mocks... "
      - mockery --log-level error
      - echo "✅"

  generate:
    desc: Install tools, generate mocks, and run go generate
    cmds:
      - task: install-tools
      - task: generate-mocks
      - echo -n "⇒ Running go generate... "
      - go generate ./...
      - echo "✅"

  build:
    desc: Build aictl for the local platform
    cmds:
      - echo -n "⇒ Building for local platform... "
      - go build -ldflags="{{.LDFLAGS}}" -trimpath -o bin/aictl cmd/run/main.go
      - echo "✅"

  build-all:
    desc: Build aictl for all platforms
    cmds:
      - task: ensure-bin
      - echo "⇒ Building for all platforms..."
      - for: [linux_amd64, linux_arm64, darwin_amd64, darwin_arm64, windows_amd64]
        cmd: |
          goos=$(echo {{.ITEM}} | cut -d'_' -f1)
          goarch=$(echo {{.ITEM}} | cut -d'_' -f2)
          ext=""
          if [ "$goos" = "windows" ]; then ext=".exe"; fi
          echo "  → $goos/$goarch"
          GOOS=$goos GOARCH=$goarch go build -ldflags="{{.LDFLAGS}}" -trimpath -o "bin/aictl_$goos-$goarch$ext" cmd/run/main.go
      - echo "✅ All builds completed."

  install:
    desc: Install aictl binary (and bash completion on Linux)
    cmds:
      - task: build
      - task: install:os
      - task: install:completion

  install:os:
    internal: true
    cmds:
      - task: install:linux
      - task: install:darwin
      - task: install:windows

  install:linux:
    internal: true
    platforms: [linux]
    cmds:
      - echo -n "⇒ Copy aictl to /usr/bin/aictl..."
      - sudo cp bin/aictl /usr/bin/aictl
      - echo "✅"

  install:darwin:
    internal: true
    platforms: [darwin]
    cmds:
      - echo -n "⇒ Copy aictl to /usr/local/bin/aictl..."
      - sudo cp bin/aictl /usr/local/bin/aictl
      - echo "✅"

  install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - |
        echo "❌ install is not supported on Windows"
        exit 1

  install:completion:
    internal: true
    cmds:
      - task: completion-bash

  completion-bash:
    desc: Install bash completion (Linux)
    platforms: [linux]
    cmds:
      - echo -n "⇒ Add bash completion..."
      - bin/aictl completion bash | sudo tee /etc/bash_completion.d/aictl >/dev/null
      - echo "✅"

  completion-zsh:
    desc: Append aictl zsh completion to ~/.zprofile (macOS)
    platforms: [darwin]
    cmds:
      - |
        set -euo pipefail
        marker='eval "$(aictl completion zsh)"'
        zprofile="${HOME}/.zprofile"
        touch "$zprofile"
        if grep -Fqx "$marker" "$zprofile"; then
          echo "⇒ zsh completion already in $zprofile ✅"
          exit 0
        fi
        printf '%s\n' 'autoload -U compinit; compinit' "$marker" >> "$zprofile"
        echo "⇒ Added zsh completion to $zprofile ✅"

  docker:
    desc: Build Docker image (linux/amd64)
    cmds:
      - docker build --platform=linux/amd64 -t "aictl:{{.VERSION}}" .

  docker-file:
    desc: Save Docker image to tar
    cmds:
      - docker save -o bin/aictl_{{.VERSION}}.tar aictl:{{.VERSION}}

  test:
    desc: Run unit tests with race detector
    cmds:
      - echo "⇒ Running tests..."
      - go test -race ./... ./internal/presenter/.utils
      - echo "⇒ Tests ✅"

  build-e2e:
    desc: Build aictl for e2e tests
    cmds:
      - echo -n "⇒ Building aictl for e2e... "
      - go build -ldflags="{{.LDFLAGS}}" -trimpath -o bin/aictl cmd/run/main.go
      - echo "✅"

  e2e-config:
    desc: Create local e2e stands config from example
    cmds:
      - test -f tests/e2e/stands.local.yaml || cp tests/e2e/stands.example.yaml tests/e2e/stands.local.yaml

  test-e2e:
    desc: Build and run e2e tests
    cmds:
      - task: build-e2e
      - chmod +x tests/e2e/run-pipeline.sh
      - go test -tags=e2e -v -timeout=45m -count=1 ./tests/e2e/...

  clean:
    desc: Remove bin directory
    cmds:
      - echo -n "⇒ Cleaning... "
      - rm -rf ./bin
      - echo "✅"

  doc:
    desc: Generate command documentation and stage it
    cmds:
      - echo -n "⇒ Generate documentation... "
      - go run ./cmd/doc/generate_doc.go
      - git add ./doc/gen/*
      - echo "✅"

  check-doc:
    desc: Fail if generated docs are outdated (does not modify doc/gen)
    cmds:
      - |
        set -euo pipefail
        # prek stashes unstaged changes and can leave doc/gen missing in the worktree;
        # restore staged doc/gen from the index before comparing.
        staged_docs=$(git ls-files 'doc/gen/**' || true)
        if [ -n "$staged_docs" ]; then
          # shellcheck disable=SC2086
          git checkout-index -f -- $staged_docs
        fi
        if [ ! -d ./doc/gen ]; then
          echo "❌ doc/gen is missing. Run 'task doc' and stage ./doc/gen, then commit."
          exit 1
        fi
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        go run ./cmd/doc/generate_doc.go "$tmp"
        if ! diff -ru ./doc/gen "$tmp" >/dev/null; then
          echo "❌ Docs outdated. Run 'task doc' and commit."
          diff -ru ./doc/gen "$tmp" | head -100 || true
          exit 1
        fi

  check:
    desc: Run check-doc, tests, lint, and arch-lint
    cmds:
      - task: check-doc
      - task: test
      - task: lint
      - go-arch-lint check
